{% extends 'restaurant/base.html' %}

{% block content %}
    <h1>Place an Order</h1>
    
    <!-- Form Submits a POST request to confirmation page-->
    <form action="{% url 'confirmation' %}" method="POST" class="site-form">
        {% csrf_token %}
        
        <!-- Menu items with checkbox-->>
        <h2>Select your Items:</h2>
        <label><input type="checkbox" name="items" value="Cheese Pizza"> Cheese Pizza ($18.00)</label><br>
        <label><input type="checkbox" name="items" value="Pepporoni Pizza"> Pepporoni Pizza ($22.00)</label><br>
        <label><input type="checkbox" name="items" value="Wings"> Wings ($9.00)</label><br>
        <label><input type="checkbox" name="items" value="2 Liter Soda"> 2 Liter Soda ($3.00)</label><br>
        <label><input type="checkbox" name="items" value="Cheesecake"> Cheesecake ($4.50)</label><br>


        <!-- Daily Special Item-->>
        <h2>Today's Special:</h2>
        <label><input type="checkbox" name="daily_special" value="{{ daily_special }}"> {{ daily_special }} ($20.00)</label><br>

        <!-- Optional extra for extra meat-->>
        <h2>Extras (Optional):</h2>
        <label for="extra_meat">Add Extra Meat ($3.00):</label>
        <select name="extra_meat" id="extra_meat">
            <option value="None">None</option>
            <option value="Extra Bacon">Extra Bacon</option>
            <option value="Extra Sausage">Extra Sausage</option>
        </select>


        <!-- Text area for special instructions or needs-->>
        <h2>Special Instructions</h2>
        <p>Please share any special instructions:</p>
        <textarea name="instructions" rows="4" style="width: 100%;"></textarea>

        <!-- Customer contact information inputs-->>
        <h2>Customer Information</h2>
        <label>Name: <input type="text" name="name" required></label><br>
        <label>Phone: <input type="text" name="phone" required></label><br>
        <label>Email: <input type="email" name="email" required></label><br>

        <br>
        <input type="submit" value="Submit Order">
    </form>
{% endblock %}
