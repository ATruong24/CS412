{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mini Insta</title>
    <!-- Link to the external CSS file -->
    <link rel="stylesheet" href="{% static 'styles.css' %}">
</head>
<body>
    <header>
        <h1>Mini Insta</h1>
        <nav>
            <!-- Uses variables to show all profiles passed through context-->
            <a href="{% url 'show_all_profiles' %}">All Profiles</a>
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
    <nav class="footer-nav">
        {% if profile %}
            <a href="{% url 'show_feed' profile.pk %}">Home</a>
        {% endif %}
        <a href="{% url 'show_all_profiles' %}">All Profiles</a>
        {% if profile %}
            <a href="{% url 'search' profile.pk %}">Search</a>
            <a href="{% url 'create_post' profile.pk %}">Create Post</a>
            <a href="{% url 'show_profile' profile.pk %}">Profile</a>
        {% endif %}
    </nav>
    <p>Mini Insta &middot; CS412</p>
</footer>
</body>
</html>
