{% extends 'mini_insta/base.html' %}

{% block content %}

<h2>Create a post for {{ profile.display_name }}</h2>

<form method="POST" action="{% url 'create_post' profile.pk %}" enctype="multipart/form-data">    
    {% csrf_token %}

    <table>
    {% for field in form %}
    <tr>
        <th>{{ field.label }}</th>
        <td>{{ field }}</td>
    </tr>
    {% endfor %}
    <tr>
        <th>Photos</th>
        <td><input type="file" name="files" accept="image/*" multiple></td>
    </tr>
    <tr>
        <td></td>
        <td>
            <input type="submit" value="Create Post">
            <a href="{% url 'show_profile' profile.pk %}">Cancel</a>
        </td>
    </tr>
    </table>
</form>

{% endblock %}
