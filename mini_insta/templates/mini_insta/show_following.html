{% extends 'mini_insta/base.html' %}

{% block content %}

<h2>
    <a href="{% url 'show_profile' profile.pk %}">@{{ profile.username }}</a>
    &middot; Following ({{ profile.get_num_following }})
</h2>

<div class="profile-grid">
    {% for followed in profile.get_following %}
    <div class="profile-card">
        <a href="{% url 'show_profile' followed.pk %}">
            <img src="{{ followed.profile_image_url }}" alt="{{ followed.username }}">
        </a>
        <h3><a href="{% url 'show_profile' followed.pk %}">{{ followed.display_name }}</a></h3>
        <p>@{{ followed.username }}</p>
    </div>
    {% empty %}
    <p>Not following anyone yet.</p>
    {% endfor %}
</div>

{% endblock %}
