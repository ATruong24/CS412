{% extends 'mini_insta/base.html' %}

{% block content %}

<h2>Update profile for @{{ profile.username }}</h2>

<form method="POST" action="{% url 'update_profile' profile.pk %}">
    {% csrf_token %}

    <table>
    {% for field in form %}
    <tr>
        <th>{{ field.label }}</th>
        <td>{{ field }}</td>
    </tr>
    {% endfor %}
    <tr>
        <td></td>
        <td>
            <input type="submit" value="Update Profile">
            <a href="{% url 'show_profile' profile.pk %}">Cancel</a>
        </td>
    </tr>
    </table>
</form>

{% endblock %}
