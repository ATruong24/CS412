{% extends 'mini_insta/base.html' %}

{% block content %}
<h2>All Profiles</h2>
<div class="profile-grid">
    {% for profile in profiles %}
    <div class="profile-card">
        <a href="{% url 'show_profile' profile.pk %}">
            <img src="{{ profile.profile_image_url }}" alt="{{ profile.username }}">
        </a>
        <h3>
            <a href="{% url 'show_profile' profile.pk %}">{{ profile.display_name }}</a>
        </h3>
        <p>@{{ profile.username }}</p>
    </div>
    {% empty %}
    <p>No profiles yet.</p>
    {% endfor %}
</div>
{% endblock %}
